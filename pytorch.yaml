includes:
  - base.yaml
targets:
  - target: /bin
    createlinks:
      - src: /opt/securerag/bin/python3
        linkname: python3
  # python packages
  - target: /opt
    copy: 
      - dirs:
          - /root/miniconda3/envs/securerag
  # python code
  - target: /
    copy:
      - dirs: 
          - ../securerag
          - ../test
          - ../data
          - ../models
          - ../log

  - target: /etc/passwd
    copy:
      - files:
        - /etc/passwd
